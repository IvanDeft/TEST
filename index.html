<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">График заказов</div>
      <div class="top-actions"><button class="today-btn" id="todayBtn">Сегодня</button><button class="icon-btn" id="prev" aria-label="Предыдущая неделя" title="Предыдущая неделя">‹</button><button class="icon-btn" id="next" aria-label="Следующая неделя" title="Следующая неделя">›</button></div>
    </header>
    <div class="layout">
      <aside class="tasks-card" aria-label="Список дел">
        <div class="task-axis-spacer"><span class="task-event-heading">Заказы</span></div>
        <div class="task-event-spacer" id="taskEventSpacer" aria-hidden="true"></div>
        <ul class="task-list" id="taskList"></ul>
      </aside>
      <section class="calendar-card" aria-label="Календарь">
        <span id="monthTitle" hidden></span>
        <div class="calendar-scroll" id="calendarScroll"><div class="grid timeline-grid" id="calendar"></div></div>
      </section>
    </div>
  </main>
  <form class="task-entry-bar" id="taskEntryForm" aria-label="Добавить задачу">
    <label class="entry-field entry-name">Название<input id="entryTaskName" maxlength="100" placeholder="Например, подготовить заказ" required></label>
    <label class="entry-field entry-start">Начало<input id="entryTaskStart" type="date" required></label>
    <label class="entry-field entry-end">Окончание<input id="entryTaskEnd" type="date" required></label>
    <button class="task-entry-submit" type="submit">Добавить задачу</button>
  </form>
  <div class="modal-backdrop" id="modal"><form class="modal" id="eventForm"><h2>Новое событие</h2><label class="field">Название<input id="eventName" maxlength="70" placeholder="Например, встреча с командой" required></label><label class="field">Дата<input id="eventDate" type="date" required></label><label class="field">Время<input id="eventTime" type="time" value="10:00" required></label><label class="field">Цвет события<select id="eventColor"><option value="">Шалфейный</option><option value="coral">Терракотовый</option><option value="blue">Голубой</option><option value="lav">Лавандовый</option></select></label><div class="modal-actions"><button type="button" class="cancel" id="cancel">Отмена</button><button class="save" type="submit">Сохранить</button></div></form></div>
  <div class="modal-backdrop" id="taskModal"><form class="modal" id="taskForm"><h2 id="taskModalTitle">Новая задача</h2><label class="field">Название<input id="taskName" maxlength="100" placeholder="Например, подготовить презентацию" required></label><label class="field">Начало<input id="taskStart" type="date" required></label><label class="field">Окончание<input id="taskEnd" type="date" required></label><div class="modal-actions"><button type="button" class="finish-task" id="finishTask" hidden>Завершить заказ</button><button type="button" class="cancel" id="taskCancel">Отмена</button><button class="save" type="submit">Сохранить</button></div></form></div>
  <script>
    const weekdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    const monthFormat=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'});
    const fullDate=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',weekday:'long'});
    const shortMonth=new Intl.DateTimeFormat('ru-RU',{month:'short'});
    const today=new Date();today.setHours(0,0,0,0);
    let timelineStart=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1),timelineEnd=new Date(today.getFullYear()+1,today.getMonth(),today.getDate()),selected=new Date(today),timelineReady=false;
    const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const shift=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
    const sampleEventNames=new Set(['Небольшая пауза','Встреча с командой','Время для себя']);
    let events=JSON.parse(localStorage.getItem('calendar-events-v1')||'[]').filter(event=>!sampleEventNames.has(event.name));
    let tasks=JSON.parse(localStorage.getItem('calendar-tasks-v1')||'[]').map(t=>({...t,start:t.start||key(today),end:t.end||t.start||key(today)}));
    const trialTaskId='trial-taburetka-20261101',trialTask=tasks.find(t=>t.id===trialTaskId),legacyTrialTask=tasks.find(t=>t.text==='Табуретка'&&t.start==='2026-11-01'&&t.end==='2026-11-13');if(trialTask){if(trialTask.start==='2026-11-01')trialTask.start='2026-10-27'}else if(legacyTrialTask){legacyTrialTask.id=trialTaskId;legacyTrialTask.start='2026-10-27'}else tasks.push({id:trialTaskId,text:'Табуретка',start:'2026-10-27',end:'2026-11-13',done:false});
    function saveEvents(){localStorage.setItem('calendar-events-v1',JSON.stringify(events))}saveEvents();
    function validOrdersDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const parsed=new Date(value+'T00:00:00Z');return !Number.isNaN(parsed.getTime())&&parsed.toISOString().slice(0,10)===value}
    function parseOrdersXml(xml){const doc=new DOMParser().parseFromString(xml,'application/xml'),root=doc.documentElement;if(doc.querySelector('parsererror')||root?.tagName!=='orders')throw new Error('GitHub вернул некорректный orders.xml.');const ids=new Set();return [...root.children].filter(node=>node.tagName==='order').map(node=>{const nameNode=[...node.children].find(child=>child.tagName==='name'),text=nameNode?.textContent.trim(),start=node.getAttribute('start'),end=node.getAttribute('end');if(!text||!validOrdersDate(start)||!validOrdersDate(end)||end<start)throw new Error('В orders.xml есть заказ с некорректными данными.');let id=node.getAttribute('id')||crypto.randomUUID();if(ids.has(id))id=crypto.randomUUID();ids.add(id);return{id,text,start,end,done:node.getAttribute('done')==='true'}})}
    async function authenticateGithubSync(){const password=prompt('Введите пароль синхронизации. Он задаётся в Vercel как ORDERS_APP_PASSWORD.');if(password===null)throw new DOMException('Авторизация отменена','AbortError');const response=await fetch('/api/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}),result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||`Ошибка авторизации (${response.status}).`)}
    async function putOrdersOnGithub(orderList){const send=()=>fetch('/api/orders',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({orders:orderList})});let response=await send();if(response.status===401){await authenticateGithubSync();response=await send()}const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||`Ошибка GitHub API (${response.status}).`)}
    async function persistTasks(nextTasks){await putOrdersOnGithub(nextTasks);tasks=nextTasks;localStorage.setItem('calendar-tasks-v1',JSON.stringify(tasks))}
    function saveTasks(){localStorage.setItem('calendar-tasks-v1',JSON.stringify(tasks))}saveTasks();
    const dateLabel=s=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(s+'T00:00:00')).replace('.','');
    function dateFromKey(value){const [year,month,day]=value.split('-').map(Number);return new Date(year,month-1,day)}
    function addMonthsClamped(date,count){const target=new Date(date.getFullYear(),date.getMonth()+count,1),lastDay=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();return new Date(target.getFullYear(),target.getMonth(),Math.min(date.getDate(),lastDay))}
    function dayIndexFrom(start,date){return Math.round((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000)}
    function setTimelineBounds(){const starts=tasks.map(t=>t.start).filter(Boolean).sort(),ends=tasks.map(t=>t.end||t.start).filter(Boolean).sort();timelineStart=starts.length?dateFromKey(starts[0]):shift(today,-1);timelineEnd=ends.length?addMonthsClamped(dateFromKey(ends.at(-1)),2):addMonthsClamped(today,2);if(timelineEnd<timelineStart)timelineEnd=new Date(timelineStart)}
    let editingTaskId=null,lastViewportOrderSignature=null;
    function renderTasks(){const list=document.getElementById('taskList');list.innerHTML='';if(!tasks.length){list.innerHTML='<li class="task-empty">Добавьте первую задачу</li>';return}tasks.forEach(task=>{const li=document.createElement('li');li.className='task-item'+(task.done?' done':'');li.dataset.taskId=task.id;const details=document.createElement('div');details.className='task-details';const text=document.createElement('span');text.className='task-text';text.textContent=task.text;const range=document.createElement('span');range.className='task-range';range.textContent=`${dateLabel(task.start)} — ${dateLabel(task.end)}`;details.append(text,range);const actions=document.createElement('span');actions.className='task-actions';const edit=document.createElement('button');edit.type='button';edit.className='task-edit';edit.textContent='✎';edit.title='Изменить даты и название';edit.onclick=()=>openTaskModal(task.id);actions.append(edit);li.append(details,actions);list.append(li)})}
    function timelineDayCount(){return Math.round((Date.UTC(timelineEnd.getFullYear(),timelineEnd.getMonth(),timelineEnd.getDate())-Date.UTC(timelineStart.getFullYear(),timelineStart.getMonth(),timelineStart.getDate()))/86400000)+1}
    function dateAtTimelineIndex(i){return new Date(timelineStart.getFullYear(),timelineStart.getMonth(),timelineStart.getDate()+i)}
    function updateMonthTitle(){const cal=document.getElementById('calendar'),scroller=document.getElementById('calendarScroll'),column=cal.querySelector('.weekday');if(!column)return;const width=column.getBoundingClientRect().width||36,index=Math.max(0,Math.min(timelineDayCount()-1,Math.floor((scroller.scrollLeft+scroller.clientWidth/2)/width))),visibleDate=dateAtTimelineIndex(index);document.getElementById('monthTitle').textContent=monthFormat.format(visibleDate).replace(/^./,s=>s.toLocaleUpperCase('ru-RU'))}
    function syncOrderVisibility(){const cal=document.getElementById('calendar'),scroller=document.getElementById('calendarScroll'),column=cal.querySelector('.weekday');if(!column||!scroller.clientWidth)return;const width=column.getBoundingClientRect().width||36,firstVisible=Math.max(0,Math.floor(scroller.scrollLeft/width)),lastVisible=Math.min(timelineDayCount()-1,Math.ceil((scroller.scrollLeft+scroller.clientWidth)/width)-1),visibleIds=new Set(tasks.filter(task=>{const start=dayIndexFrom(timelineStart,dateFromKey(task.start)),end=dayIndexFrom(timelineStart,dateFromKey(task.end||task.start));return end>=firstVisible&&start<=lastVisible}).map(task=>task.id)),signature=tasks.filter(task=>visibleIds.has(task.id)).map(task=>task.id).join('|');if(signature===lastViewportOrderSignature)return;lastViewportOrderSignature=signature;const hasEvents=document.getElementById('taskEventSpacer').style.display!=='none',items=new Map([...document.getElementById('taskList').children].filter(item=>item.dataset.taskId).map(item=>[item.dataset.taskId,item])),elementsByTask=new Map();cal.querySelectorAll('[data-task-id]').forEach(element=>{const id=element.dataset.taskId;if(!elementsByTask.has(id))elementsByTask.set(id,[]);elementsByTask.get(id).push(element)});tasks.forEach(task=>{const visible=visibleIds.has(task.id);items.get(task.id)?.classList.toggle('order-out-of-view',!visible);(elementsByTask.get(task.id)||[]).forEach(element=>element.classList.toggle('order-out-of-view',!visible))});const rowTracks=tasks.length?tasks.map(task=>visibleIds.has(task.id)?'var(--order-row-height)':'0px'):['var(--order-row-height)'];cal.style.gridTemplateRows=['var(--date-axis-height)',...(hasEvents?['var(--event-axis-height)']:[]),...rowTracks].join(' ')}
    function render(){
      const cal=document.getElementById('calendar'),scroller=document.getElementById('calendarScroll'),oldScroll=scroller.scrollLeft,oldColumn=cal.querySelector('.weekday'),oldWidth=oldColumn?.getBoundingClientRect().width||36,oldIndex=Math.floor(oldScroll/oldWidth),oldOffset=oldScroll-oldIndex*oldWidth,oldAnchor=timelineReady?dateAtTimelineIndex(oldIndex):null;setTimelineBounds();lastViewportOrderSignature=null;cal.innerHTML='';const dayCount=timelineDayCount(),hasVisibleEvents=events.some(e=>e.date>=key(timelineStart)&&e.date<=key(timelineEnd));document.getElementById('taskEventSpacer').style.display=hasVisibleEvents?'':'none';cal.style.setProperty('--days',dayCount);cal.style.gridTemplateRows=`var(--date-axis-height)${hasVisibleEvents?' var(--event-axis-height)':''} repeat(${Math.max(tasks.length,1)},var(--order-row-height))`;
      for(let i=0;i<dayCount;i++){const d=dateAtTimelineIndex(i),k=key(d),weekday=(d.getDay()+6)%7,monthBoundary=d.getDate()===1,isToday=k===key(today);const heading=document.createElement('div');heading.className='weekday'+(weekday>=5?' weekend':'')+(monthBoundary?' month-boundary':'')+(isToday?' today-col':'');heading.textContent=`${weekdays[weekday]} ${d.getDate()}`;heading.title=fullDate.format(d);heading.style.gridColumn=String(i+1);if(monthBoundary){const monthName=document.createElement('span');monthName.className='month-name';monthName.textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(d).replace(/^./,s=>s.toLocaleUpperCase('ru-RU')).replace(/\s*г\.$/,'г.');heading.append(monthName)}cal.append(heading);const eventCell=document.createElement('div');eventCell.className='event-track'+(monthBoundary?' month-boundary':'')+(isToday?' today-col':'');eventCell.style.gridColumn=String(i+1);events.filter(e=>e.date===k).sort((a,b)=>a.time.localeCompare(b.time)).forEach(e=>{const chip=document.createElement('div');chip.className='event-chip';chip.title=e.name;chip.textContent=e.name;eventCell.append(chip)});if(hasVisibleEvents)cal.append(eventCell)}
      if(!tasks.length){for(let i=0;i<dayCount;i++){const d=dateAtTimelineIndex(i),blank=document.createElement('div');blank.className='track-cell'+(d.getDate()===1?' month-boundary':'')+(key(d)===key(today)?' today-col':'');blank.style.gridColumn=String(i+1);blank.style.gridRow=hasVisibleEvents?'3':'2';cal.append(blank)}}
      tasks.forEach((task,row)=>{for(let i=0;i<dayCount;i++){const d=dateAtTimelineIndex(i),k=key(d),active=k>=task.start&&k<=task.end,cell=document.createElement('div');cell.className='track-cell'+(active?' active':'')+(k===task.start?' range-start':'')+(k===task.end?' range-end':'')+(task.done?' task-done':'')+(k===key(today)?' today-col':'')+(d.getDate()===1?' month-boundary':'');cell.dataset.taskId=task.id;cell.style.gridColumn=String(i+1);cell.style.gridRow=String(row+(hasVisibleEvents?3:2));if(active)cell.setAttribute('aria-label',`${task.text}: ${fullDate.format(d)}`);cal.append(cell)}const dayMs=86400000,startIndex=Math.max(0,Math.floor((Date.parse(task.start+'T00:00:00Z')-Date.parse(key(timelineStart)+'T00:00:00Z'))/dayMs)),endIndex=Math.min(dayCount-1,Math.floor((Date.parse(task.end+'T00:00:00Z')-Date.parse(key(timelineStart)+'T00:00:00Z'))/dayMs));if(startIndex<=endIndex){const taskRow=row+(hasVisibleEvents?3:2),taskGridColumn=`${startIndex+1} / ${endIndex+2}`,cloud=document.createElement('div');cloud.className='task-cloud'+(task.done?' done':'');cloud.dataset.taskId=task.id;cloud.setAttribute('aria-hidden','true');cloud.style.gridColumn=taskGridColumn;cloud.style.gridRow=String(taskRow);cal.append(cloud);const label=document.createElement('div'),labelText=document.createElement('span');label.className='task-sticky-label'+(task.done?' done':'');label.dataset.taskId=task.id;labelText.className='task-sticky-text';labelText.textContent=task.text;label.append(labelText);label.title=`${task.text} · ${dateLabel(task.start)} — ${dateLabel(task.end)}`;label.style.gridColumn=taskGridColumn;label.style.gridRow=String(taskRow);cal.append(label)}});
      if(!timelineReady){timelineReady=true;requestAnimationFrame(()=>{const width=cal.querySelector('.weekday')?.getBoundingClientRect().width||36,max=Math.max(0,scroller.scrollWidth-scroller.clientWidth),initialIndex=Math.max(0,dayIndexFrom(timelineStart,today)-1);scroller.scrollLeft=Math.min(max,initialIndex*width);document.getElementById('monthTitle').textContent=monthFormat.format(today).replace(/^./,s=>s.toLocaleUpperCase('ru-RU'));updateMonthTitle();syncOrderVisibility()})}else{const width=cal.querySelector('.weekday')?.getBoundingClientRect().width||36,max=Math.max(0,scroller.scrollWidth-scroller.clientWidth),anchorIndex=oldAnchor?dayIndexFrom(timelineStart,oldAnchor):0;scroller.scrollLeft=Math.max(0,Math.min(max,anchorIndex*width+oldOffset));updateMonthTitle();syncOrderVisibility()}
    }
    const modal=document.getElementById('modal');function openModal(){document.getElementById('eventDate').value=key(selected);modal.classList.add('open');document.getElementById('eventName').focus()}function closeModal(){modal.classList.remove('open')}
    const taskModal=document.getElementById('taskModal');function openTaskModal(id=null){editingTaskId=id;const task=tasks.find(t=>t.id===id);document.getElementById('taskModalTitle').textContent=task?'Изменить задачу':'Новая задача';document.getElementById('taskName').value=task?.text||'';document.getElementById('taskStart').value=task?.start||key(selected);document.getElementById('taskEnd').value=task?.end||key(selected);document.getElementById('taskEnd').min=document.getElementById('taskStart').value;document.getElementById('finishTask').hidden=!task||task.done;taskModal.classList.add('open');document.getElementById('taskName').focus()}function closeTaskModal(){taskModal.classList.remove('open')}
    document.getElementById('taskCancel').onclick=closeTaskModal;document.getElementById('finishTask').onclick=async()=>{if(!tasks.some(t=>t.id===editingTaskId))return;try{await persistTasks(tasks.map(task=>task.id===editingTaskId?{...task,done:true}:task));renderTasks();render();closeTaskModal()}catch(error){alert(error.name==='AbortError'?'Авторизация отменена. Изменения не сохранены.':`Не удалось сохранить данные в GitHub: ${error.message}`)}};taskModal.onclick=e=>{if(e.target===taskModal)closeTaskModal()};document.getElementById('taskStart').onchange=e=>{const end=document.getElementById('taskEnd');end.min=e.target.value;if(end.value<e.target.value)end.value=e.target.value};
    document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const text=document.getElementById('taskName').value.trim(),start=document.getElementById('taskStart').value,end=document.getElementById('taskEnd').value;if(end<start){document.getElementById('taskEnd').value=start;return}const nextTasks=editingTaskId?tasks.map(task=>task.id===editingTaskId?{...task,text,start,end}:task):[...tasks,{id:crypto.randomUUID(),text,start,end,done:false}];try{await persistTasks(nextTasks);renderTasks();render();closeTaskModal()}catch(error){alert(error.name==='AbortError'?'Авторизация отменена. Изменения не сохранены.':`Не удалось сохранить данные в GitHub: ${error.message}`)}};
    const entryStart=document.getElementById('entryTaskStart'),entryEnd=document.getElementById('entryTaskEnd');function resetEntryDates(){entryStart.value=key(today);entryEnd.value=key(shift(today,30));entryEnd.min=entryStart.value}resetEntryDates();entryStart.onchange=e=>{entryEnd.min=e.target.value;if(entryEnd.value<e.target.value)entryEnd.value=e.target.value};document.getElementById('taskEntryForm').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('entryTaskName'),start=entryStart.value,end=entryEnd.value;if(end<start){entryEnd.value=start;return}const nextTasks=[...tasks,{id:crypto.randomUUID(),text:name.value.trim(),start,end,done:false}];try{await persistTasks(nextTasks);renderTasks();render();name.value='';resetEntryDates();name.focus()}catch(error){alert(error.name==='AbortError'?'Авторизация отменена. Изменения не сохранены.':`Не удалось сохранить данные в GitHub: ${error.message}`)}};
    function moveWeek(direction){const scroller=document.getElementById('calendarScroll'),column=document.querySelector('#calendar .weekday'),step=(column?.getBoundingClientRect().width||36)*7,max=Math.max(0,scroller.scrollWidth-scroller.clientWidth),target=scroller.scrollLeft+direction*step;scroller.scrollTo({left:Math.max(0,Math.min(max,target)),behavior:'smooth'})}
    const scroller=document.getElementById('calendarScroll');let scrollFramePending=false;scroller.addEventListener('scroll',()=>{if(scrollFramePending)return;scrollFramePending=true;requestAnimationFrame(()=>{updateMonthTitle();syncOrderVisibility();scrollFramePending=false})});window.addEventListener('resize',()=>requestAnimationFrame(syncOrderVisibility));
    document.getElementById('prev').onclick=()=>moveWeek(-1);document.getElementById('next').onclick=()=>moveWeek(1);document.getElementById('todayBtn').onclick=()=>{selected=new Date(today);const width=document.querySelector('#calendar .weekday')?.getBoundingClientRect().width||36,index=dayIndexFrom(timelineStart,today)-1,max=Math.max(0,scroller.scrollWidth-scroller.clientWidth);scroller.scrollTo({left:Math.max(0,Math.min(max,index*width)),behavior:'smooth'})};document.getElementById('cancel').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.onkeydown=e=>{if(e.key==='Escape'){closeModal();closeTaskModal()}};
    document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();const date=document.getElementById('eventDate').value;events.push({id:crypto.randomUUID(),name:document.getElementById('eventName').value.trim(),date,time:document.getElementById('eventTime').value,color:document.getElementById('eventColor').value});selected=new Date(date+'T00:00:00');saveEvents();closeModal();e.target.reset();render()};
    renderTasks();render();
    async function loadGithubOrders(){if(location.protocol==='file:')return;try{const response=await fetch('/api/orders',{cache:'no-store',credentials:'same-origin'});if(!response.ok)return;const remote=parseOrdersXml(await response.text()),remoteIds=new Set(remote.map(task=>task.id)),merged=[...remote,...tasks.filter(task=>!remoteIds.has(task.id))];tasks=merged;localStorage.setItem('calendar-tasks-v1',JSON.stringify(tasks));renderTasks();render()}catch(error){console.warn('Не удалось загрузить orders.xml из GitHub:',error)}}
    loadGithubOrders();
  </script>
